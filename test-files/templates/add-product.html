<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add product</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="top-bar">
        <h1>Add product</h1>
        <a class="btn" th:href="@{/products}">Back to products</a>
    </header>

    <main>
        <form class="form" th:action="@{/products/save}" th:object="${product}" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}">

            <label for="price">Price</label>
            <input type="number" id="price" step="0.01" th:field="*{price}">

            <label for="image">Image file name</label>
            <input type="text" id="image" th:field="*{image}">

            <label for="details">Details</label>
            <textarea id="details" rows="4" th:field="*{details}"></textarea>

            <button type="submit" class="btn">Save product</button>
        </form>
    </main>
</body>
</html>
