<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="top-bar">
        <h1 th:text="${product.name}">Product</h1>
        <a class="btn" th:href="@{/products}">Back to products</a>
    </header>

    <main class="details" th:if="${product != null}">
        <img th:src="@{'/images/' + ${product.image}}" th:alt="${product.name}">
        <div class="info">
            <p class="price" th:text="${product.price}">0.0</p>
            <p th:text="${product.details}">Details</p>
        </div>
    </main>
</body>
</html>
